<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - ｗｗｗレポ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/build/css/style.css}">
</head>
<body class="p-loginPage">
    <!-- App Header -->
    <header class="l-appHeader">
      <a th:href="@{/}" class="l-logo">ｗｗｗレポ</a>
      <div class="l-headerActions">
        <button class="c-menuToggle">
          <span class="material-icons">menu</span>
        </button>
      </div>
    </header>

    <div class="l-app">
        <div class="l-container">
            <div class="l-header">
                <h1>ログイン</h1>
            </div>

            <div class="c-loginForm">
                <div class="c-formGroup">
                    <input type="email" id="email" placeholder="メールアドレス" required>
                    <div class="c-inputIcon">
                        <span class="material-icons">check_circle</span>
                    </div>
                </div>

                <div class="c-formGroup">
                    <input type="password" id="password" placeholder="パスワード" required>
                    <div class="c-inputIcon">
                        <span class="material-icons">visibility</span>
                    </div>
                </div>

                <button class="c-btnPrimary u-fullWidth" data-action="handle-login">
                    ログイン
                </button>

                <div class="c-divider">
                    <span>または</span>
                </div>

                <button class="c-btnSocial google" data-action="login-google">
                    <span class="material-icons">login</span><span class="u-englishText">Google</span>でログイン
                </button>

                <button class="c-btnSocial facebook" data-action="login-facebook">
                    <span class="material-icons">login</span><span class="u-englishText">Facebook</span>でログイン
                </button>
            </div>

            <div class="c-signupLink">
                <p>アカウントをお持ちでない方は</p>
                <button class="c-btnLink" data-action="show-signup">新規登録</button>
            </div>
        </div>
    </div>

    <!-- Side Navigation -->
    <nav class="l-sideNav" id="sideNav">
      <div class="l-sideNavHeader">
        <h2>ｗｗｗレポ</h2>
        <p>お笑いライブアンケート</p>
      </div>
      <div class="l-sideNavMenu">
        <a th:href="@{/}" class="l-sideNavItem">
          <span class="material-icons">home</span>
          ホーム
        </a>
        <a th:href="@{/account}" class="l-sideNavItem">
          <span class="material-icons">account_circle</span>
          アカウント
        </a>
        <a th:href="@{/live-detail}" class="l-sideNavItem">
          <span class="material-icons">people</span>
          出演者管理
        </a>
        <a th:href="@{/results}" class="l-sideNavItem">
          <span class="material-icons">analytics</span>
          集計結果
        </a>
        <a th:href="@{/settings}" class="l-sideNavItem">
          <span class="material-icons">settings</span>
          設定
        </a>
        <a href="#" class="l-sideNavItem" data-action="handle-logout">
          <span class="material-icons">logout</span>
          ログアウト
        </a>
      </div>
    </nav>

    <!-- Navigation Overlay -->
    <div class="l-navOverlay" id="navOverlay"></div>

    <script type="module" th:src="@{/build/js/index.js}"></script>
    <script type="module" th:src="@{/build/js/navigation.js}"></script>
</body>
</html>
